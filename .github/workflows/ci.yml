name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_API_URL: https://interviews-api.sonic.game
          NEXT_PUBLIC_WS_MARKET_URL: wss://interviews-api.sonic.game/ws
          NEXT_PUBLIC_WS_STREAM_URL: wss://interviews-api.sonic.game/ws/stream
